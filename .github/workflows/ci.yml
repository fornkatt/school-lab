name: CI   

on: 
  push:
    branches:
      - main
  pull_request: 
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGURATION: Debug
      STARTED_BY: ${{ github.actor }}
      ACTION: ${{ github.action }}
      BRANCH: ${{ github.ref }}

      run: |
        echo "Startad av ${{ github.actor }} — händelse: ${{ github.action }} — gren: ${{ github.ref }}"
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7 
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: .NET restore
      run: dotnet restore
    - name: .NET build
      run: dotnet build --no-restore --configuration $BUILD_CONFIGURATION
    - name: .NET test
      run: dotnet test --no-build --configuration $BUILD_CONFIGURATION
